<style>
:root{
  color-scheme:light;
  --bg:#F4F3F1; --surface:#FFFFFF; --ink:#26231F; --muted:#6C6761; --line:#E4E1DC;
  --accent:#D0202E; --accent-ink:#fff; --mark:#D0202E; --mark-soft:rgba(208,32,46,.10); --danger:#9E1420; --ok:#2C7A57; --warn:#A5650B;
  --side:#2A2826; --side-ink:#ECE9E4; --side-line:#403D3A; --side-mute:#A8A39C;
  --side-hover:rgba(255,255,255,.07); --side-on:rgba(255,255,255,.12); --field:#FFFFFF; --hover:rgba(38,35,31,.04);
  --shadow:none; --ring:rgba(208,32,46,.16); --code:#EFEDEA;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --eagle:#4A3426; --eagle-head:#FBF8F2;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E1D1B; --surface:#282624; --ink:#ECE9E4; --muted:#A39E97; --line:#3A3733;
  --accent:#F0505D; --accent-ink:#2a0609; --mark:#F0505D; --mark-soft:rgba(240,80,93,.16); --danger:#FF8A92; --ok:#5DBB92; --warn:#E0A548;
  --side:#151413; --side-ink:#E4E1DC; --side-line:#34312E; --side-mute:#98938C;
  --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.11); --field:#232120; --hover:rgba(255,255,255,.05);
  --shadow:none; --ring:rgba(240,80,93,.28); --code:#1A1918; --eagle:#A88670; --eagle-head:#FBF8F2;
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:grid;grid-template-columns:252px 1fr;min-height:100vh}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em;line-height:1.15}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Sidebar */
#side{background:var(--side);border-right:1px solid var(--line);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
/* v2.0: Kopfbereich mit Logo und Adler */
.brand{position:relative;flex:none;display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;padding:4px 2px 16px;margin-bottom:2px;border-bottom:1px solid var(--side-line);overflow:hidden}
.brand:focus-visible{outline-offset:-2px;border-radius:8px}
.brand .logo{width:48px;height:48px;flex:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(30,32,36,.22));transform-origin:50% 85%;transition:transform .25s cubic-bezier(.3,1.6,.5,1);animation:logoBoop 16s linear 1.5s infinite}
.brand:hover .logo{transform:rotate(-6deg) scale(1.06)}
.brand .wm{display:flex;flex-direction:column;gap:3px;line-height:1;min-width:0}
.brand .wm b{font:700 24px var(--head);letter-spacing:-.025em}
.brand .wm span{font:600 15px var(--head);color:var(--accent);letter-spacing:.01em}
.brand .eagle{position:absolute;top:-3px;left:0;width:58px;height:auto;pointer-events:none;z-index:2;opacity:0;transform:translate(240px,0);animation:eagleFly 16s linear 1.5s infinite}
.eagle .body,.eagle .wing{fill:var(--eagle)}
.eagle .wing{transform-origin:25px 15px;animation:flap .42s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.75)}}
@keyframes eagleFly{
  0%{opacity:0;transform:translate(240px,-2px) rotate(0deg);animation-timing-function:ease-out}
  2%{opacity:1;transform:translate(228px,-2px) rotate(0deg);animation-timing-function:ease-in-out}
  19%{opacity:1;transform:translate(80px,3px) rotate(-4deg);animation-timing-function:ease-in}
  25%{opacity:1;transform:translate(30px,14px) rotate(-14deg) scale(.9)}
  26.5%{opacity:0;transform:translate(14px,20px) rotate(-18deg) scale(.55)}
  100%{opacity:0;transform:translate(14px,20px) scale(.55)}
}
@keyframes logoBoop{
  0%,25%{transform:none}
  27%{transform:scale(.86) rotate(-5deg)}
  30%{transform:scale(1.1) rotate(4deg)}
  33%{transform:scale(.97) rotate(-2deg)}
  36%,100%{transform:none}
}
#side input{width:100%;background:var(--field);border:1px solid var(--side-line);border-radius:8px;padding:9px 11px;color:var(--ink)}
#side input::placeholder{color:var(--side-mute)}
#side input:focus{border-color:var(--mark);outline:none}
#side nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
#side nav a{color:var(--side-ink);text-decoration:none;padding:9px 11px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
#side nav a:hover{background:var(--side-hover)}
#side nav a.on{background:var(--side-on);color:var(--ink);font-weight:600}
#side nav b{font:600 12px var(--body);background:var(--mark);color:#fff;border-radius:99px;padding:1px 8px}
#side nav b:empty{display:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-mute)}
.side-foot .ver{display:block;margin-top:8px;opacity:.75}
.side-foot a{color:var(--side-ink)}

/* Main */
main{padding:34px 40px 80px;max-width:1040px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.ph h1{font-size:32px}
.ph p{margin:4px 0 0;color:var(--muted)}
.sec{margin:0 0 30px}
.sec>h2{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec>h2 small{font:500 13px var(--body);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:11px 14px;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.empty{color:var(--muted);padding:16px 14px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:wait}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=search],input[type=time],input:not([type]),select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:15px}
.chk{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}

/* Pills & chips */
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.st-onboarding{background:#FBE1E3;color:#8F1520}
.st-aktiv{background:#DCEFE5;color:#1E5E43}
.st-wartet{background:#F8E9C8;color:#7B4E06}
.st-pausiert{background:#DFE1E3;color:#484B50}
.st-fertig{background:#DFE1E3;color:#484B50;text-decoration:line-through}
:root[data-theme="dark"] .st-onboarding{background:#4A1C21;color:#FFB3B9}
:root[data-theme="dark"] .st-aktiv{background:#1B3B2E;color:#9BDDBC}
:root[data-theme="dark"] .st-wartet{background:#47350F;color:#F1CE86}
:root[data-theme="dark"] .st-pausiert,:root[data-theme="dark"] .st-fertig{background:#3A3E43;color:#B5B9BE}
.due{font-size:12px;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--warn);font-weight:600}
.due.late{color:var(--danger);font-weight:600}
.mark{background:var(--mark-soft);border-radius:4px;padding:1px 6px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.segs{display:flex;gap:2px;min-width:60px;max-width:160px;flex:1}
.segs span{flex:1;height:6px;background:var(--line);border-radius:2px;min-width:3px}
.segs span.on{background:var(--ok)}
.tag{font-size:13px;color:var(--accent);text-decoration:none}
.wl{text-decoration:none;border-bottom:1px solid var(--accent)}
.wl.new{border-bottom-style:dashed;color:var(--muted)}

/* Dashboard lines */
.line{display:flex;align-items:center;gap:12px}
.line .txt{flex:1;min-width:0}
.line .pn{font-size:12px;color:var(--muted);display:block;text-decoration:none}
.line .pn:hover{text-decoration:underline}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:22px}

/* Project list */
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1.6fr);gap:16px;align-items:center;text-decoration:none;color:inherit}
.prow:hover strong{text-decoration:underline}
.prow .nx{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark);font-weight:600}
.tabs button small{color:var(--muted)}

/* Project page */
.back{font-size:13px;text-decoration:none;color:var(--muted)}
.title-input{font:700 30px var(--head)!important;border:1px solid transparent!important;background:transparent!important;padding:2px 6px!important;margin:4px -6px 12px;width:100%}
.title-input:hover,.title-input:focus{border-color:var(--line)!important;background:var(--field)!important}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.nextbar{display:flex;gap:18px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--mark);border-radius:8px;padding:14px 18px;margin-bottom:20px}
.nextbar small{color:var(--muted);display:block}
.nextbar strong{font:600 19px var(--head)}
.nextbar p{margin:4px 0 0;color:var(--muted);font-size:14px}
.nextbar.ok{border-left-color:var(--ok);font-weight:600}
.phase{font:600 13px var(--body);color:var(--muted);margin:22px 0 6px}
.steps{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.step{border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step-main{display:flex;align-items:center;gap:12px;padding:10px 14px}
.step-title{flex:1;text-align:left;background:none;border:0;padding:2px 0;cursor:pointer;font-weight:500;min-width:0}
.step.done .step-title{color:var(--muted);text-decoration:line-through;font-weight:400}
.step.waiting{background:rgba(208,32,46,.07)}
.step-detail{padding:2px 14px 14px 44px;display:grid;gap:10px}
.step-detail .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hintbox{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.addrow{display:grid;grid-template-columns:2fr 1fr 150px auto;gap:8px;margin-top:14px}
.log-item{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:start}
.log-item .d{font-size:13px;color:var(--muted);padding-top:2px}
.prose{white-space:normal;overflow-wrap:anywhere}
.logform{display:grid;grid-template-columns:150px 150px 1fr;gap:8px;margin-bottom:12px}
.logform textarea{grid-column:1/-1}
.t-Kommunikation{background:#FBE1E3;color:#8F1520}.t-Entscheidung{background:#D0202E;color:#fff}.t-Notiz{background:#DFE1E3;color:#484B50}
:root[data-theme="dark"] .t-Kommunikation{background:#4A1C21;color:#FFB3B9}:root[data-theme="dark"] .t-Entscheidung{background:#F0505D;color:#2a0609}:root[data-theme="dark"] .t-Notiz{background:#3A3E43;color:#B5B9BE}

/* Notes */
.note-row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;text-decoration:none;color:inherit}
.note-row:hover strong{text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inbox-item{display:grid;gap:8px}
.inbox-item .row{display:flex;gap:8px;flex-wrap:wrap}
.inbox-item select{width:auto;min-width:180px}
.note-ed{display:grid;gap:14px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:60px}

/* Templates */
.tstep{display:grid;grid-template-columns:150px 1.4fr 1.6fr 80px auto;gap:8px;align-items:center;padding:10px 14px}
.tstep .btns{display:flex;gap:2px}

/* awork */
.task{display:flex;gap:12px;align-items:center}
.task .txt{flex:1;min-width:0}
pre.code{background:var(--code);color:var(--ink);border:1px solid var(--line);padding:14px;border-radius:8px;overflow:auto;font-size:13px;line-height:1.5;margin:8px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{width:auto;min-width:160px}
.err{color:var(--danger);background:var(--surface);border:1px solid var(--danger);border-radius:8px;padding:10px 14px;margin-bottom:14px}

/* Feinschliff v1.3 */
.btn,input,select,textarea{transition:border-color .15s,background-color .15s,box-shadow .15s,filter .15s}
input:not([type=checkbox]):not(.title-input):focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);outline:none}
#side nav a.on{box-shadow:inset 3px 0 0 var(--mark)}
dialog{box-shadow:0 12px 40px rgba(30,32,36,.22)}

/* v1.5: Kontakt-Erinnerung & Spotter */
.banner.hot{border-left-color:var(--accent)}
.ev .evd{display:flex;flex-direction:column;min-width:104px}
.evrow,.evform{display:grid;grid-template-columns:150px 110px 150px 1fr auto;gap:8px;align-items:center}
.evrow{padding:10px 14px}
.evform{margin-bottom:14px}
details.past{margin-top:6px}
details.past>summary{cursor:pointer;color:var(--muted);margin-bottom:10px;font-weight:500}

/* v1.6: Dokumente */
.docrow{display:grid;grid-template-columns:minmax(0,1.4fr) 150px 150px minmax(0,1.4fr) auto auto;gap:8px;align-items:center}
.docrow.doc-Angefordert{box-shadow:inset 3px 0 0 var(--warn)}
.docrow.doc-Erhalten{box-shadow:inset 3px 0 0 var(--ok)}
.docform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.tdoc{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.docrow .nolink{min-width:62px}
/* v2.3: Informationen von der Praxis */
.inforow{display:grid;grid-template-columns:auto minmax(0,1.6fr) 150px minmax(0,1.2fr) auto;gap:8px;align-items:center}
.inforow.done{box-shadow:inset 3px 0 0 var(--ok)}
.inforow.done .infoname{color:var(--muted);text-decoration:line-through}
.tinfo{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}

/* v1.8: Archiv */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.fact small{color:var(--muted);display:block}
.fact b{font:600 20px var(--head)}
dialog[open]{max-height:92vh;overflow:auto}

/* v1.9: FAQ */
.faq-grp{margin-bottom:20px}
.faq-grp>h3{font:600 14px var(--body);color:var(--muted);margin:0 0 8px}
.faq details{border-top:1px solid var(--line)}
.faq details:first-child{border-top:0}
.faq summary{cursor:pointer;padding:11px 14px;font-weight:500}
.faq summary:hover{background:var(--hover)}
.faq .ans{padding:2px 14px 14px;max-width:72ch}
.faq .ans p{margin:0 0 8px}
.faq .ans ul,.faq .ans ol{margin:6px 0 8px;padding-left:20px}
.faq .ans li{margin-bottom:3px}
.newtag{font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 8px;margin-left:8px}
.chv{min-width:52px}

/* Modal & toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,92vw)}
dialog::backdrop{background:rgba(30,32,36,.4);backdrop-filter:blur(2px)}
.mform{padding:22px;display:grid;gap:14px}
.mform h2{font-size:20px}
.mfoot{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
mark{background:#F3D75A;color:#2a2400;padding:0 1px;border-radius:2px}

@media (max-width:860px){
  body{grid-template-columns:1fr}
  #side{border-right:0;border-bottom:1px solid var(--line);position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  #side nav{flex-direction:row;flex-wrap:wrap;margin:0;order:5;width:100%}
  #side form,#side>input{flex:1;min-width:140px}
  .side-foot{display:none}
  .brand{flex:0 0 auto;min-width:230px;border-bottom:0;padding-bottom:4px}
  main{padding:22px 16px 60px}
  .prow{grid-template-columns:1fr auto}.prow .nx{grid-column:1/-1}
  .tstep{grid-template-columns:1fr 1fr}.addrow{grid-template-columns:1fr 1fr}.evrow,.evform,.docrow{grid-template-columns:1fr 1fr}.inforow{grid-template-columns:auto 1fr}
  .logform{grid-template-columns:1fr 1fr}.log-item{grid-template-columns:1fr auto}.log-item .d{grid-column:1/-1}
  .step-detail{padding-left:14px}
}

/* v2.1: Startbildschirm */
#splash{display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4.5vh,36px);padding:24px;text-align:center;color:#F1EFEC;overflow:hidden;--eagle:#B08F78;--eagle-head:#FBF8F2;
  background:radial-gradient(ellipse 65% 50% at 50% 42%,rgba(208,32,46,.24),transparent 72%),radial-gradient(ellipse 120% 80% at 50% 120%,rgba(240,80,93,.10),transparent 60%),#1D1F22;transition:opacity .45s ease}
html.splash-on #splash{display:flex}
html.splash-on body{overflow:hidden}
#splash.leave{opacity:0;pointer-events:none}
.sp-stage{position:relative;display:grid;place-items:center;transition:transform .45s cubic-bezier(.5,0,.8,.4)}
#splash.leave .sp-stage{transform:scale(1.45)}
.sp-logo{position:relative;isolation:isolate;display:block;width:clamp(140px,28vmin,230px);aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;border-radius:26%;animation:spIn .9s cubic-bezier(.2,.9,.3,1.15) backwards,spBoop .8s ease 3.05s}
.sp-logo::before{content:"";position:absolute;inset:-32%;z-index:-1;background:radial-gradient(circle,rgba(240,80,93,.38),transparent 62%);animation:spFade 1.4s ease .2s backwards}
.sp-logo img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 28px rgba(0,0,0,.5));transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sp-logo:hover img{transform:rotate(-4deg) scale(1.05)}
.sp-logo:focus-visible{outline:3px solid #F0505D;outline-offset:10px}
.sp-eagle{position:absolute;left:50%;top:50%;width:clamp(96px,19vmin,160px);height:auto;pointer-events:none;opacity:0;transform:translate(calc(-50% + 62vw),calc(-50% - 26vh));animation:spFly 2.3s linear .85s both}
.sp-wm{font:700 clamp(32px,6.4vmin,56px) var(--head);letter-spacing:-.025em;line-height:1;animation:spFade .8s ease .5s backwards}
.sp-wm span{color:#F0505D}
.sp-hint{font:500 15px var(--body);color:rgba(241,239,236,.62);animation:spFade .8s ease 3.5s backwards}
@keyframes spIn{from{opacity:0;transform:scale(.6) translateY(24px)}}
@keyframes spFade{from{opacity:0}}
@keyframes spBoop{0%{transform:none}25%{transform:scale(.86) rotate(-5deg)}55%{transform:scale(1.1) rotate(4deg)}80%{transform:scale(.97) rotate(-1.5deg)}100%{transform:none}}
@keyframes spFly{
  0%{opacity:0;transform:translate(calc(-50% + 62vw),calc(-50% - 26vh)) rotate(6deg);animation-timing-function:ease-out}
  8%{opacity:1;animation-timing-function:ease-in-out}
  55%{opacity:1;transform:translate(calc(-50% + 24vmin),calc(-50% - 13vmin)) rotate(-4deg);animation-timing-function:ease-in}
  86%{opacity:1;transform:translate(calc(-50% + 9vmin),calc(-50% - 2vmin)) rotate(-14deg) scale(.92)}
  100%{opacity:0;transform:translate(calc(-50% + 3vmin),calc(-50% + 1vmin)) rotate(-18deg) scale(.45)}
}
@media (prefers-reduced-motion:reduce){#splash *,#splash *::before{animation:none!important}.sp-eagle{display:none}*{transition:none!important}.brand .eagle{display:none}.brand .logo{animation:none}}

/* v2.4: neues Erscheinungsbild – flach, ruhig, klare Hierarchie */
.brand{color:var(--side-ink)}
.brand .wm span{color:#F0505D}
#side input{background:rgba(255,255,255,.07);color:var(--side-ink);border-color:var(--side-line);border-radius:6px}
#side input:focus{border-color:#F0505D}
#side nav a{border-radius:6px;color:var(--side-ink)}
#side nav a.on{color:var(--side-ink);box-shadow:inset 3px 0 0 #F0505D}
.side-foot,.side-foot a{color:var(--side-mute)}
.panel,.steps,.preview,.fact,.card{border-radius:8px;box-shadow:none}
.btn{border-radius:6px;padding:7px 13px}
.btn.sm{padding:3px 9px}
.btn:hover{border-color:var(--ink)}
.btn.primary:hover{border-color:var(--accent)}
input,select,textarea{border-radius:6px}
.pill{border-radius:5px}
.chk{-webkit-appearance:none;appearance:none;width:18px;height:18px;border:1.5px solid #B1ACA5;border-radius:5px;background:var(--surface);display:inline-grid;place-content:center;flex:none;margin:0;cursor:pointer;transition:background-color .12s,border-color .12s}
.chk:hover{border-color:var(--ok)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
:root[data-theme="dark"] .chk{border-color:#6E6963}
.tabs{gap:0;margin-bottom:20px}
.tabs button{border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-size:14px}
.tabs button.on{border-bottom-color:var(--accent)}
.tabs button small{font-variant-numeric:tabular-nums;margin-left:4px}
.phase{font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;margin:24px 0 8px}
.step.done .step-title{color:var(--muted)}
.list>li{padding:10px 14px}

/* Projektkopf */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap;margin:2px 0 22px}
.phead .main{min-width:0;flex:1 1 340px}
.phead .title-input{margin:6px -6px 2px}
.psub{color:var(--muted);font-size:14px;display:flex;gap:2px 16px;flex-wrap:wrap;align-items:center}
.psub b{color:var(--ink);font-weight:600}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statussel{width:auto;font-weight:600;padding:6px 10px}
.detailsbox{margin:-8px 0 24px}
.detailsbox .meta{margin-bottom:14px}

/* Cockpit */
.cockpit{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin:0 0 28px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);padding:16px 18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.card-h h2{font-size:16px}
.card-h .num{font:600 24px var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.card-h .num small{font:500 14px var(--body);color:var(--muted)}
.card.done .num{color:var(--ok)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .3s}
.miss{list-style:none;margin:0;padding:0}
.miss li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.miss li:first-child{border-top:0}
.miss .t{flex:1;min-width:0;line-height:1.4}
.card .more{margin-top:6px}
.card .more .btn{padding-left:0}
.allok{margin:0;color:var(--ok);font-weight:600}
.next-t{font:600 17px/1.3 var(--head);margin:2px 0 6px}

/* Praxis-Infos: Tabelle statt Formular */
.ihead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
.ihead h2{font-size:20px}
.isec{font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.inforow.open{grid-template-columns:auto minmax(0,1.7fr) minmax(0,1fr) auto}
.inforow.done{grid-template-columns:auto minmax(0,1.7fr) 150px minmax(0,1fr) auto;box-shadow:none}
.inforow .infoname{font-weight:500}
.inforow input:not(.chk){border-color:transparent;background:transparent}
.inforow input:not(.chk):hover{border-color:var(--line)}
.inforow input:not(.chk):focus{border-color:var(--accent);background:var(--field)}
.inforow input[type=date]{color:var(--muted)}
.inforow.done .infoname{color:var(--muted);text-decoration:none}
.iadd{margin-top:14px}
@media (max-width:860px){
  .cockpit{grid-template-columns:1fr}
  .inforow.open,.inforow.done{grid-template-columns:auto minmax(0,1fr) auto}
  .inforow .infoname{grid-column:2;grid-row:1}
  .inforow .btn{grid-column:3;grid-row:1}
  .inforow input:not(.chk){grid-column:2/-1;border-color:var(--line)}
}

/* v2.4 Feinschliff */
.steps:empty{display:none}
.inforow textarea{resize:none;overflow:hidden;line-height:1.4;padding:6px 10px;border-color:transparent;background:transparent}
.inforow textarea:hover{border-color:var(--line)}
.inforow textarea:focus{border-color:var(--accent);background:var(--field)}
.inforow input::placeholder{color:transparent}
.inforow:hover input::placeholder,.inforow input:focus::placeholder{color:var(--muted)}
.inforow .btn.danger{border-color:transparent;color:var(--muted);opacity:.45}
.inforow:hover .btn.danger{opacity:1;color:var(--danger)}
/* v2.4 Links in Listen ruhiger */
.line .txt>a:not(.pn){color:var(--ink);text-decoration:none}
.line .txt>a:not(.pn):hover{text-decoration:underline}
</style>
</head>

function blank(){return {projects:[],templates:[onboardingTemplate()],notes:[],settings:{aworkUrl:'',aworkToken:'',lastBackup:null,seedOnboarding:true,onboardingV:2},awork:{tasks:[],syncedAt:null}}}
function migrate(d){
  const seeded=!!(d.settings&&d.settings.seedOnboarding),ov=(d.settings&&d.settings.onboardingV)||0,b=blank();
  const m=Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{}),awork:Object.assign(b.awork,d.awork||{})});
  if(!Array.isArray(m.templates))m.templates=[];
  if(ov<2){
    /* v1.4: neuer ausführlicher Ablauf; der bisherige bleibt als „(alt)“ erhalten */
    m.templates.forEach(t=>{if(t.name===ONBOARDING_NAME)t.name+=' (alt)'});
    m.templates.unshift(onboardingTemplate());m.settings.seedOnboarding=true;m.settings.onboardingV=2;
  }else if(!seeded){if(!m.templates.some(t=>t.name===ONBOARDING_NAME))m.templates.unshift(onboardingTemplate());m.settings.seedOnboarding=true}
  /* v1.7: Beispielprojekt und alte Beispielvorlage einmalig entfernen */
  if(!m.settings.cleanedV7){
    m.projects=(m.projects||[]).filter(p=>!(p.name==='Beispiel: Neue Praxis'&&p.client==='Muster-Praxis'));
    m.templates=m.templates.filter(t=>t.name!==ONBOARDING_NAME+' (alt)');
    m.settings.cleanedV7=true;
  }
  /* v1.6: Dokumentenlisten (Vorlagen und Projekte); Platzhalter nur einmalig im Standard-Ablauf */
  m.templates.forEach(t=>{if(!Array.isArray(t.docs))t.docs=(t.name===ONBOARDING_NAME)?DOCS():[]});
  /* v2.2: Platzhalter durch echte Dokumente ersetzen (nur wenn unberührt), fehlende Dateinamen ergänzen */
  const isPh=n=>/^Dokument [12]$/.test(String(n));
  m.templates.forEach(t=>{
    if(t.name===ONBOARDING_NAME&&t.docs.length&&t.docs.every(d=>isPh(d.name)))t.docs=DOCS();
    t.docs.forEach(d=>{if(typeof d.file!=='string'){const x=DOC_DEFAULTS.find(q=>q[0].toLowerCase()===String(d.name).toLowerCase());d.file=x?x[1]:''}});
  });
  (m.projects||[]).forEach(p=>{if(Array.isArray(p.docs)&&p.docs.length&&p.docs.every(d=>isPh(d.name)&&d.status==='Offen'&&!d.note&&!d.date))p.docs=DOCS().map(d=>({id:d.id,name:d.name,status:'Offen',date:'',note:''}))});
  /* v2.3: Informationen von der Praxis (alte Daten und Backups bleiben lesbar) */
  m.templates.forEach(t=>{if(!Array.isArray(t.infos))t.infos=(t.name===ONBOARDING_NAME)?INFOS():[]});
  (m.projects||[]).forEach(p=>{if(!Array.isArray(p.infos))p.infos=[]});
  /* v1.5: neue Projektfelder mit Standardwerten (alte Daten und Backups bleiben lesbar) */
  (m.projects||[]).forEach(p=>{if(!Array.isArray(p.events))p.events=[];if(p.remind===undefined)p.remind=null;if(!Array.isArray(p.docs))p.docs=[];if(p.review===undefined)p.review=null});
  return m;
}

function remindTxt(p){const r=p.remind,d=diffDays(r.due,today());return(d<=0?'heute fällig':'seit '+plural(d,'Tag','Tagen')+' fällig')+' · Rhythmus: '+remindLabel(r)}

const evDay=iso=>{const d=new Date(iso+'T00:00:00');const y=d.getFullYear()!==new Date().getFullYear();return d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',...(y?{year:'numeric'}:{})})};

}

  if(t&&Array.isArray(t.docs))p.docs=t.docs.map(d=>({id:uid(),name:d.name,status:'Offen',date:'',note:''}));
  if(t&&Array.isArray(t.infos))p.infos=t.infos.map(d=>({id:uid(),name:d.name,done:false,date:'',note:''}));

  S.projects.unshift(p);save();return p;
}

/* ============ Rich-Text: [[Links]] und #tags ============ */
function resolveLink(name){
  const l=name.toLowerCase();
  const n=S.notes.find(n=>!n.inbox&&(n.title||'').toLowerCase()===l);if(n)return{type:'notiz',id:n.id};
  const p=S.projects.find(p=>p.name.toLowerCase()===l);if(p)return{type:'projekt',id:p.id};
  return null;
}
function rich(text){
  const re=/\[\[([^\]]+)\]\]|(^|\s)#([\p{L}\d_-]+)/gu;let out='',last=0,m;text=text||'';
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    if(m[1]!==undefined){const name=m[1].trim(),r=resolveLink(name);
      out+=r?`<a class="wl" href="#/${r.type}/${r.id}">${esc(name)}</a>`:`<a class="wl new" href="#" data-action="newNote" data-title="${esc(name)}" title="Notiz „${esc(name)}“ anlegen">${esc(name)}</a>`;
    }else out+=esc(m[2])+`<a class="tag" href="#/notizen?tag=${encodeURIComponent(m[3])}">#${esc(m[3])}</a>`;
    last=re.lastIndex;
  }
  return (out+esc(text.slice(last))).replace(/\n/g,'<br>');
}
function snip(text,q){const i=text.toLowerCase().indexOf(q);if(i<0)return esc(text.slice(0,100));const a=Math.max(0,i-40),b=Math.min(text.length,i+q.length+70);return(a>0?'…':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,b))+(b<text.length?'…':'')}

const pill=st=>`<span class="pill ${STCLASS[st]||''}">${esc(st)}</span>`;
function dueChip(s){

  return`<span class="due ${d<0?'late':d<=2?'soon':''}" title="${fmtDate(s.due)}">${txt}</span>`;
}

  ${sec('Kontakt aufnehmen',rem.length?`<ul class="list panel">${rem.map(p=>`<li class="line"><div class="txt"><a href="#/projekt/${p.id}"><b>${esc(p.name)}</b></a><span class="muted small" style="display:block">${remindTxt(p)}</span></div><button class="btn sm primary" data-action="remindDone" data-pid="${p.id}">Kontakt erledigt</button></li>`).join('')}</ul>`:'',rem.length)}
  ${sec('Überfällig',overdue.length?`<ul class="list panel">${overdue.map(r=>stepLine(r.p,r.s)).join('')}</ul>`:'',overdue.length)}
  ${sec('Termine in den nächsten 7 Tagen',evs.length?`<ul class="list panel">${evs.map(evLine).join('')}</ul><p class="small"><a href="#/spotter">Alle Termine im Spotter</a></p>`:'',evs.length)}
  ${sec('Nächster Schritt je Projekt',nexts.length?`<ul class="list panel">${nexts.map(x=>stepLine(x.p,x.s)).join('')}</ul>`:empty('Keine offenen Schritte in aktiven Projekten.'))}
  ${sec('Fehlt noch von der Praxis',miss.length?`<ul class="list panel">${miss.map(({p,o})=>`<li class="line"><div class="txt"><a href="#/projekt/${p.id}"><b>${esc(p.name)}</b></a><span class="muted small" style="display:block">${plural(o.length,'Information fehlt','Informationen fehlen')} · als Nächstes: ${esc(o[0].name)}</span></div><button class="btn sm" data-action="openTab" data-tab="infos" data-pid="${p.id}">Öffnen</button></li>`).join('')}</ul>`:'',miss.length)}
  ${sec('In den nächsten 7 Tagen fällig',soon.length?`<ul class="list panel">${soon.map(r=>stepLine(r.p,r.s)).join('')}</ul>`:'',soon.length)}
  ${sec('Wartet auf den Kunden',(waitP.length||waitS.length)?`<ul class="list panel">${waitP.map(p=>`<li class="line"><div class="txt"><a href="#/projekt/${p.id}"><b>${esc(p.name)}</b></a></div><span class="due">Projekt seit ${plural(diffDays(p.statusSince||p.created,t),'Tag','Tagen')}</span></li>`).join('')}${waitS.map(({p,s})=>`<li class="line"><div class="txt"><a class="pn" href="#/projekt/${p.id}">${esc(p.name)}</a>${esc(s.title)}</div><span class="due">seit ${plural(diffDays(s.waitingSince||t,t),'Tag','Tagen')}</span></li>`).join('')}</ul>`:'')}

/* ---- Archiv ---- */
const closedAt=p=>(p.review&&p.review.closedAt)||p.statusSince||p.created;
const runDays=p=>Math.max(0,diffDays(p.start||p.created,closedAt(p)));
views.archiv=()=>{
  if(route.id)return archivDetail(route.id);
  const list=S.projects.filter(p=>p.status==='Abgeschlossen').sort((a,b)=>closedAt(b).localeCompare(closedAt(a)));
  return`<div class="ph"><div><h1>Archiv</h1><p>Abgeschlossene Projekte mit Review.</p></div></div>
  ${list.length?`<ul class="list panel">${list.map(p=>{const {d,n}=progress(p),r=p.review,has=r&&(r.good||r.bad||r.next);
    const parts=[p.client,'Laufzeit '+plural(runDays(p),'Tag','Tage'),n?'Schritte '+d+'/'+n:'',p.docs.length?'Dokumente '+p.docs.filter(x=>x.status==='Erhalten').length+'/'+p.docs.length:'',has?'':'Review fehlt'].filter(Boolean);
    return`<li><a class="note-row" href="#/archiv/${p.id}"><span><strong>${esc(p.name)}</strong><span class="muted small" style="display:block">${parts.map(esc).join(' · ')}</span></span><span class="muted small">abgeschlossen ${fmtDate(closedAt(p))}</span></a></li>`}).join('')}</ul>`:empty('Noch keine abgeschlossenen Projekte. Auf der Projektseite findest du „Projekt abschließen“.')}`;
};
function archivDetail(id){

  const dec=p.log.filter(l=>l.type==='Entscheidung').sort((a,b)=>a.date.localeCompare(b.date));
  const got=p.docs.filter(x=>x.status==='Erhalten').length;
  const fact=(l,v)=>`<div class="fact"><small>${l}</small><b>${v}</b></div>`;
  const rf=(field,label)=>`<label class="f">${label}<textarea rows="4" data-change="reviewField" data-pid="${p.id}" data-field="${field}">${esc(r[field]||'')}</textarea></label>`;

  <div class="facts">${fact('Laufzeit',plural(runDays(p),'Tag','Tage'))}${n?fact('Schritte erledigt',d+' von '+n):''}${p.docs.length?fact('Dokumente erhalten',got+' von '+p.docs.length):''}${(p.infos||[]).length?fact('Praxis-Infos erhalten',(p.infos||[]).filter(d=>d.done).length+' von '+(p.infos||[]).length):''}${fact('Kommunikation',plural(comm,'Eintrag','Einträge'))}${p.goLive?fact('Go-live',fmtDate(p.goLive)):''}</div>
  <section class="sec"><h2>Review</h2><div style="display:grid;gap:14px">
   <label class="f" style="max-width:220px">Abschlussdatum<input type="date" value="${esc(closedAt(p))}" data-change="reviewField" data-pid="${p.id}" data-field="closedAt"></label>

  ${(p.knowledge||'').trim()?`<section class="sec"><h2>Kundenwissen</h2><div class="panel" style="padding:14px 16px"><div class="prose">${rich(p.knowledge)}</div></div></section>`:''}`;
}

/* ---- Spotter ---- */
let spF={type:'',project:''};

  const types=[...EVENT_TYPES,'Projektende'];

  ${G.map(([k,l])=>l.length?`<section class="sec"><h2>${k}<small>${l.length}</small></h2><ul class="list panel">${l.map(evLine).join('')}</ul></section>`:'').join('')}
  ${!up.length?empty(ev.length?'Keine kommenden Termine für diesen Filter.':'Noch keine Termine. Trage bei einem Projekt das Go-live ein oder lege oben einen Termin an.'):''}

    :`<p class="muted small" style="margin:0 0 10px">Noch keine Infos angelegt.</p><button class="btn sm" data-action="infoLoad" data-pid="${p.id}">Standardliste laden</button>`}</section>`;

    ${nx?`<small class="muted">Nächster Schritt</small><p class="next-t">${esc(nx.title)}</p>${nx.hint?`<p class="muted small" style="margin:0 0 10px">${esc(nx.hint)}</p>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="doneNext" data-pid="${p.id}">Erledigt</button><button class="btn ghost" data-action="tab" data-tab="ablauf">Ablauf öffnen</button></div>`:(n?'<p class="allok">Alle Schritte erledigt.</p>':'<p class="muted small" style="margin:0">Dieses Projekt hat keine Schritte.</p>')}</section>`;

function tabAblauf(p){
  let last=null;
  const items=p.steps.map(s=>{
    const head=(s.phase&&s.phase!==last)?`</ul><h3 class="phase">${esc(s.phase)}</h3><ul class="steps">`:'';if(s.phase)last=s.phase;

    const fld=(field,label,tag,val)=>`<label class="f">${label}${tag==='textarea'?`<textarea rows="2" data-change="stepField" ${da} data-field="${field}">${esc(val)}</textarea>`:`<input type="${field==='due'?'date':'text'}" value="${esc(val)}" data-change="stepField" ${da} data-field="${field}">`}</label>`;
    return head+`<li class="step ${s.done?'done':''} ${s.waiting&&!s.done?'waiting':''}">
    <div class="step-main"><input type="checkbox" class="chk" ${s.done?'checked':''} data-change="toggleStep" ${da} aria-label="Erledigt">
    <button class="step-title" data-action="expandStep" data-sid="${s.id}" aria-expanded="${open}">${isNext&&!s.done?`<span class="mark">${esc(s.title)}</span>`:esc(s.title)}</button>
    ${s.waiting&&!s.done?`<span class="pill st-wartet">wartet seit ${plural(diffDays(s.waitingSince||today(),today()),'Tag','Tagen')}</span>`:''}${dueChip(s)}</div>
    ${open?`<div class="step-detail">${s.hint?`<div class="hintbox">${esc(s.hint)}</div>`:''}
      ${fld('title','Titel','input',s.title)}${fld('hint','Frage / Hinweis zu diesem Schritt','textarea',s.hint)}${fld('note','Notiz','textarea',s.note)}${fld('due','Fällig am','input',s.due)}
      <div class="row"><button class="btn sm" data-action="stepWait" ${da}>${s.waiting?'Nicht mehr wartend':'Wartet auf Kunde'}</button>
      <button class="btn sm" data-action="stepToTpl" ${da}>In Vorlage übernehmen</button>
      <button class="btn sm" data-action="stepMove" data-dir="-1" ${da} aria-label="Nach oben">↑</button><button class="btn sm" data-action="stepMove" data-dir="1" ${da} aria-label="Nach unten">↓</button>
      <button class="btn sm danger" data-action="stepDel" ${da}>Löschen</button></div></div>`:''}</li>`;
  }).join('');
  const phases=[...new Set(p.steps.map(s=>s.phase).filter(Boolean))];
  return`${p.steps.length?`<ul class="steps">${items}</ul>`:empty('Noch keine Schritte. Füge unten welche hinzu oder übernimm einen Ablauf aus einer Vorlage.')}
  <form class="addrow" data-submit="addStep" data-pid="${p.id}"><input name="title" placeholder="Neuer Schritt …" required><input name="phase" list="phases" placeholder="Phase (optional)"><input name="due" type="date"><button class="btn">Hinzufügen</button></form>
  <datalist id="phases">${phases.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <p style="margin-top:14px"><button class="btn sm" data-action="addFromTpl" data-pid="${p.id}">Schritte aus Vorlage ergänzen</button></p>`;
}

async function syncAwork(){
  const {aworkUrl,aworkToken}=S.settings;
  if(!aworkUrl){toast('Erst die Web-App-URL in den Einstellungen eintragen');location.hash='#/einstellungen';return}
  syncing=true;aworkError='';render();
  try{
    const url=aworkUrl+(aworkUrl.includes('?')?'&':'?')+'action=tasks'+(aworkToken?'&token='+encodeURIComponent(aworkToken):'');
    const r=await fetch(url,{redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();if(data.error)throw new Error(data.error);
    const list=Array.isArray(data)?data:(data.tasks||[]);
    S.awork.tasks=list.map(t=>{const status=t.status||t.state||'';return{id:String(t.id??uid()),name:t.name||t.title||'(ohne Titel)',project:t.project||t.projectName||'',projectId:t.projectId?String(t.projectId):'',status,done:t.done??/erledigt|done|closed|abgeschlossen|completed/i.test(status),due:String(t.due||t.dueOn||'').slice(0,10),assignee:t.assignee||'',url:t.url||''}});
    S.awork.syncedAt=new Date().toISOString();save();toast(plural(list.length,'Aufgabe','Aufgaben')+' geladen');
  }catch(err){aworkError='Synchronisieren fehlgeschlagen: '+err.message+'. Prüfe Web-App-URL, Geheimwort und ob die Bereitstellung auf „Zugriff: Jeder“ steht. Nach Code-Änderungen im Skript muss eine neue Version bereitgestellt werden.'}
  syncing=false;render();
}

  <ul class="list panel">${(t.docs||[]).map(d=>`<li class="tdoc"><input value="${esc(d.name)}" data-change="tplDoc" data-field="name" data-tid="${t.id}" data-did="${d.id}" aria-label="Dokumentname"><input value="${esc(d.file||'')}" placeholder="Dateiname, z. B. Agenda.pdf" data-change="tplDoc" data-field="file" data-tid="${t.id}" data-did="${d.id}" aria-label="Dateiname"><button class="btn sm ghost danger" data-action="tplDocDel" data-tid="${t.id}" data-did="${d.id}" aria-label="Löschen">✕</button></li>`).join('')||empty('Noch keine Dokumente.')}</ul>
  <p><button class="btn" data-action="tplDocAdd" data-tid="${t.id}">Dokument hinzufügen</button></p></section>
  <section class="sec" style="margin-top:28px"><h2>Informationen von der Praxis</h2><p class="muted small" style="margin:-4px 0 10px">Diese Liste wird bei jedem neuen Projekt kopiert. Im Projekt hakst du ab, was die Praxis schon geliefert hat.</p>
  <ul class="list panel">${(t.infos||[]).map(d=>`<li class="tinfo"><input value="${esc(d.name)}" data-change="tplInfo" data-tid="${t.id}" data-did="${d.id}" aria-label="Information"><button class="btn sm ghost danger" data-action="tplInfoDel" data-tid="${t.id}" data-did="${d.id}" aria-label="Löschen">✕</button></li>`).join('')||empty('Noch keine Informationen.')}</ul>
  <p><button class="btn" data-action="tplInfoAdd" data-tid="${t.id}">Information hinzufügen</button></p></section>`;
};

/* ---- Suche ---- */
views.suche=()=>{
  const q=searchQ.trim().toLowerCase();
  if(!q)return`<div class="ph"><h1>Suche</h1></div>${empty('Tippe links einen Begriff ein. Durchsucht werden Projekte, Schritte, Verlauf, Notizen und awork-Aufgaben.')}`;
  const R={Projekte:[],Schritte:[],Verlauf:[],Notizen:[],awork:[]};
  S.projects.forEach(p=>{
    const hay=[p.name,p.client,p.contact.name,p.knowledge,...p.docs.map(d=>d.name+' '+d.note),...(p.infos||[]).map(d=>d.name+' '+(d.note||'')),...(p.review?[p.review.good,p.review.bad,p.review.next]:[])].join(' ');
    if(hay.toLowerCase().includes(q))R.Projekte.push(`<li><a href="#/projekt/${p.id}"><b>${esc(p.name)}</b></a><div class="muted small">${snip(hay,q)}</div></li>`);
    p.steps.forEach(s=>{const h=s.title+' '+s.note+' '+s.hint;if(h.toLowerCase().includes(q))R.Schritte.push(`<li><a href="#/projekt/${p.id}">${esc(p.name)}</a> · ${snip(h,q)}</li>`)});
    p.log.forEach(l=>{if((l.text+' '+l.who).toLowerCase().includes(q))R.Verlauf.push(`<li><a href="#/projekt/${p.id}">${esc(p.name)}</a> · ${fmtDate(l.date)} · ${snip(l.text,q)}</li>`)});
  });
  S.notes.forEach(n=>{const h=(n.title||'')+' '+(n.body||'');if(h.toLowerCase().includes(q))R.Notizen.push(`<li><a href="#/${n.inbox?'notizen':'notiz/'+n.id}"><b>${esc(n.title||(n.inbox?'Inbox':'Ohne Titel'))}</b></a><div class="muted small">${snip(h,q)}</div></li>`)});
  S.awork.tasks.forEach(t=>{if((t.name+' '+t.project).toLowerCase().includes(q))R.awork.push(`<li>${esc(t.project)} · ${snip(t.name,q)}</li>`)});
  const total=Object.values(R).reduce((a,b)=>a+b.length,0);
  return`<div class="ph"><div><h1>Suche</h1><p>${plural(total,'Treffer','Treffer')} für „${esc(searchQ)}“</p></div></div>`+
   (Object.entries(R).filter(([,v])=>v.length).map(([k,v])=>`<section class="sec"><h2>${k} <small>${v.length}</small></h2><ul class="list panel">${v.slice(0,30).join('')}</ul></section>`).join('')||empty('Nichts gefunden.'));
};

  {v:'1.0',q:'Was ist Eagle Eye tomedo® und wofür nutze ich es?',a:'<p>Ein persönliches Projekt-Cockpit für Kundenprojekte. Du arbeitest Abläufe als Checkliste ab, siehst immer den nächsten Schritt, hältst Termine, Dokumente, Entscheidungen und Notizen fest und vergisst keinen Kunden.</p><p>Das Tool ist eine einzelne Datei. Es braucht keinen Server und keine Anmeldung, du öffnest sie einfach im Browser.</p>'},
  {v:'1.0',q:'Wo liegen meine Daten, und wer kann sie sehen?',a:'<p>Alle Daten liegen nur in diesem Browser auf diesem Rechner. Sie werden nirgends hochgeladen, andere sehen sie nicht. Das heißt aber auch: Löschst du die Browserdaten oder wechselst Browser oder Rechner, sind sie weg. Ziehe deshalb regelmäßig ein Backup (Abschnitt Backup weiter oben auf dieser Seite).</p>'},
  {v:'1.0',q:'Wie lege ich mein erstes Projekt an?',a:'<ol><li>Auf <b>Heute</b> oder <b>Projekte</b> auf „Neues Projekt“ klicken.</li><li>Projektname, Kunde und Ansprechpartner eintragen.</li><li>Einen Ablauf (Vorlage) wählen und das Projektstart-Datum setzen.</li></ol><p>Der Ablauf wird als Checkliste ins Projekt kopiert. Danach kannst du oben im Projekt weitere Felder ausfüllen, z. B. awork-Link, Kuto-Link, Go-live und Kontakt-Erinnerung.</p>'},
  {v:'1.0',q:'Was zeigt mir die Seite „Heute“?',a:'<p>Alles, was jetzt wichtig ist. Blöcke ohne Inhalt werden ausgeblendet:</p><ul><li><b>Kontakt aufnehmen:</b> fällige Kontakt-Erinnerungen</li><li><b>Überfällig</b> und <b>In den nächsten 7 Tagen fällig:</b> Schritte mit Fälligkeitsdatum</li><li><b>Termine in den nächsten 7 Tagen</b></li><li><b>Nächster Schritt je Projekt</b></li><li><b>Wartet auf den Kunden</b></li><li><b>Könnte untergehen:</b> Projekte ohne Ablauf, mit komplett erledigtem Ablauf oder ohne Kommunikations-Eintrag seit 10 Tagen (wenn keine Erinnerung gesetzt ist)</li><li><b>Aus awork:</b> bald fällige Aufgaben</li></ul><p>Die Zahl neben „Heute“ in der Seitenleiste zählt überfällige Schritte und fällige Kontakt-Erinnerungen.</p>'},
  {v:'1.0',q:'Welche Tastenkürzel gibt es?',a:'<p><b>N</b> springt in das Feld „Schnell notieren“ (Inbox), <b>/</b> in die Suche. Beides funktioniert nur, wenn du gerade nicht in einem Eingabefeld tippst.</p>'},
  {v:'2.1',q:'Was ist der Startbildschirm?',a:'<p>Beim ersten Öffnen am Tag siehst du nur das große tomedo-Logo. Der Adler fliegt an, dann klickst du aufs Logo (oder drückst Enter) und das Tool öffnet sich. <b>Esc</b> überspringt den Start. Am selben Tag öffnet sich das Tool beim Neuladen direkt, der Startbildschirm kommt erst am nächsten Tag wieder.</p>'},
  {v:'2.0',q:'Was hat es mit dem Adler oben links auf sich?',a:'<p>Nichts Wichtiges, nur ein Gag: Alle paar Sekunden fliegt ein Adler auf das tomedo-Logo zu. Ein Klick auf Logo oder Schriftzug bringt dich jederzeit zurück zu <b>Heute</b>. Hast du in deinem System Animationen reduziert, bleibt der Adler aus.</p>'},
  {v:'1.9',q:'Was ist in dieser Version neu?',a:'<p>Das steht im Änderungsprotokoll am Ende dieser FAQ. Neue Funktionen bekommen dort einen Eintrag und, wo nötig, eine eigene Frage. Fragen zu Funktionen der aktuellen Version sind mit „neu“ markiert.</p>'}

 {g:'Projekte und Abläufe',items:[
  {v:'1.0',q:'Wie arbeite ich den Ablauf eines Projekts ab?',a:'<p>Projekt öffnen, Tab <b>Ablauf</b>. Setze den Haken vor einem Schritt oder klicke im Kasten „Nächster Schritt“ auf <b>Erledigt</b>. Klickst du auf den Titel eines Schritts, klappt er auf: Dort stehen der Hinweis, eine Notiz, die Fälligkeit und die Knöpfe zum Verschieben und Löschen. Neue Schritte fügst du unten hinzu.</p>'},
  {v:'1.0',q:'Was bedeutet „Wartet auf Kunde“?',a:'<p>Hängt ein Schritt am Kunden, klappe ihn auf und klicke auf <b>Wartet auf Kunde</b>. Er erscheint dann auf „Heute“ mit der Zahl der Wartetage. Den Status gibt es auch für das ganze Projekt (Feld „Status“ oben im Projekt).</p>'},
  {v:'1.0',q:'Was sind Abläufe (Vorlagen), und wie ändere ich sie?',a:'<p>Unter <a href="#/vorlagen">Abläufe</a> liegen deine Standardprozesse mit Phasen, Schritten, Hinweisen und optional einer Fälligkeit in Tagen nach Projektstart. Jedes neue Projekt bekommt eine <b>Kopie</b>. Änderungen an der Vorlage gelten deshalb nur für neue Projekte, bestehende bleiben unverändert.</p><ul><li><b>Schritte aus Vorlage ergänzen</b> (im Tab Ablauf) holt neue Schritte und Dokumente in ein laufendes Projekt, ohne etwas doppelt anzulegen.</li><li><b>In Vorlage übernehmen</b> (im aufgeklappten Schritt) und <b>Ablauf als Vorlage speichern</b> (oben im Projekt) übertragen Erfahrungen zurück in eine Vorlage.</li></ul>'},
  {v:'1.0',q:'Wozu dienen die Tabs Verlauf und Wissen?',a:'<p><b>Verlauf</b> ist das Logbuch des Projekts: Kommunikation, Entscheidungen und Notizen mit Datum. <b>Wissen</b> ist Freitext für alles, was man über den Kunden wissen sollte. Trage dort keine Passwörter ein.</p>'},
  {v:'1.0',q:'Wie lösche ich ein Projekt?',a:'<p>Oben im Projekt auf <b>Projekt löschen</b>. Das entfernt Schritte, Verlauf und alles andere unwiderruflich. Ist das Projekt nur fertig, nimm besser <b>Projekt abschließen</b>, dann bleibt es im Archiv. Im Zweifel vorher ein Backup ziehen.</p>'}

 {g:'Erinnerungen, Termine und Dokumente',items:[
  {v:'1.5',q:'Wie funktioniert die Kontakt-Erinnerung?',a:'<p>Im Projekt bei <b>Kontakt-Erinnerung</b> einen Rhythmus wählen (1 Tag bis 4 Wochen) oder ein eigenes Datum setzen. Gespeichert wird sofort. Ist das Datum erreicht, erscheint das Projekt auf „Heute“ unter „Kontakt aufnehmen“, dazu ein Banner im Projekt.</p><p>Die Erinnerung bleibt, bis du <b>Kontakt erledigt</b> klickst. Dabei kannst du eine Kurznotiz eintragen (sie kommt in den Verlauf) und wählst: gleichen Rhythmus fortsetzen, neuen Rhythmus setzen oder beenden. Gezählt wird ab dem Abhaken.</p><p>Das Tool kann nur warnen, wenn es geöffnet ist. Im Tab-Titel steht die Zahl offener Erinnerungen, z. B. „(2) Eagle Eye tomedo®“. Lässt du den Tab über Nacht offen, lade ihn morgens einmal mit F5 neu.</p>'},
  {v:'1.5',q:'Was ist der Spotter, und wie kommen Termine hinein?',a:'<p>Der <a href="#/spotter">Spotter</a> zeigt alle Termine deiner Projekte auf einen Blick, gruppiert nach Diese Woche, Nächste Woche und Später. Vergangenes ist eingeklappt. Filtern kannst du nach Typ und Projekt.</p><p>Termine legst du im Projekt im Tab <b>Termine</b> an oder im Spotter über „Neuer Termin“ (Go-live, Installation, Schulung, Kick-off, Meeting, Sonstiges). Das Feld <b>Go-live</b> im Projekt und das daraus berechnete Projektende (Go-live + 9 Wochen) erscheinen automatisch.</p>'},
  {v:'2.4',q:'Wo sehe ich, was von der Praxis noch fehlt?',a:'<p>Direkt oben im Projekt: Die Karte <b>Fehlt noch von der Praxis</b> zeigt die nächsten offenen Informationen mit Fortschrittsbalken. Du kannst sie dort sofort abhaken. Daneben steht der Start-Ablauf mit dem nächsten Schritt.</p><p>Im Tab <b>Praxis-Infos</b> siehst du alles getrennt in „Fehlt noch“ und „Erhalten“. Auf <a href="#/heute">Heute</a> listet der Abschnitt „Fehlt noch von der Praxis“ alle aktiven Projekte mit offenen Infos. Die Projektdaten (Kunde, Links, Go-live …) findest du hinter dem Button <b>Projektdaten</b>.</p>'},
  {v:'2.3',q:'Wie hake ich ab, welche Informationen ich von der Praxis schon habe?',a:'<p>Im Projekt im Tab <b>Praxis-Infos</b>. Dort steht die Liste „Informationen von der Praxis“ mit einer Checkbox pro Zeile. Beim Abhaken setzt sich das Datum automatisch, eine Notiz ist optional. Der Zähler am Tab (z. B. 5/20) zeigt den Stand.</p><p>Die Standardliste pflegst du in der Vorlage unter „Informationen von der Praxis“, neue Projekte bekommen sie automatisch. In ein bestehendes Projekt holst du sie mit <b>Liste aus Vorlage laden</b> (im leeren Tab) oder mit <b>Schritte aus Vorlage ergänzen</b>.</p>'},
  {v:'2.2',q:'Wie öffne ich die Dokumente, die wir an den Kunden schicken?',a:'<p>Im Projekt im Tab <b>Dokumente</b> steht bei jedem Dokument mit hinterlegter Datei der Button <b>Öffnen</b>. Die Standardvorlage enthält Agenda, Allgemeine Angaben, Betriebsstätte, Nutzer, Terminarten, Unterschriften und Verträge.</p><p>Den Dateinamen pflegst du unter <a href="#/vorlagen">Abläufe</a> in der Vorlage neben dem Dokumentnamen. Dort geht auch ein kompletter Link (https://…). Der Button nutzt immer den aktuellen Dateinamen aus der Vorlage, auch in laufenden Projekten. Ohne Dateinamen erscheint kein Button.</p>'},
  {v:'1.6',q:'Wie halte ich fest, welche Dokumente der Kunde zurückgeschickt hat?',a:'<p>Im Projekt im Tab <b>Dokumente</b>. Jedes Dokument hat einen Status: <b>Offen</b>, <b>Angefordert</b> oder <b>Erhalten</b>. Das Datum setzt sich beim Statuswechsel automatisch, eine Notiz ist optional. Der Zähler am Tab (z. B. 3/8) und in der Projektliste zeigt den Stand.</p><p>Welche Dokumente zu einem Projekt gehören, pflegst du in der Vorlage unter „Dokumente vom Kunden“. Neue Projekte bekommen die Liste automatisch.</p>'}
 ]},
 {g:'Notizen und Suche',items:[
  {v:'1.0',q:'Wie nutze ich die Inbox?',a:'<p>Links oben im Feld „Schnell notieren“ (Taste <b>N</b>) landet jeder Gedanke in der Inbox. Später sortierst du ihn unter <a href="#/notizen">Notizen</a> ein: <b>Ins Projekt-Verlauf</b> (vorher Projekt wählen), <b>Notiz daraus machen</b> oder löschen. Die Zahl an „Notizen“ zeigt, wie viele noch in der Inbox liegen.</p>'},
  {v:'1.0',q:'Wie verknüpfe ich Notizen und Projekte?',a:'<p>Schreibe <b>[[Titel]]</b> in eine Notiz, einen Verlaufseintrag oder das Kundenwissen. Gibt es eine Notiz oder ein Projekt mit diesem Namen, wird daraus ein Link, sonst legt ein Klick die Notiz neu an. Mit <b>#tag</b> ordnest du Notizen ein. Die Tags erscheinen als Filter unter Notizen. Auf einer Notiz siehst du außerdem, wo sie verlinkt ist.</p>'},
  {v:'1.0',q:'Was durchsucht die Suche?',a:'<p>Das Feld links (Taste <b>/</b>) durchsucht Projekte, Kundenwissen, Dokumente, Reviews, Schritte, Verlauf, Notizen und awork-Aufgaben.</p>'}
 ]},
 {g:'Abschluss und Archiv',items:[
  {v:'1.8',q:'Wie schließe ich ein Projekt ab, und wo finde ich es danach?',a:'<p>Im Projekt oben auf <b>Projekt abschließen</b>. Du trägst ein kurzes Review ein: Was lief gut, was lief schlecht oder hat sich verzögert, was machst du nächstes Mal anders. Danach verschwindet das Projekt von „Heute“, aus dem Spotter und aus den Erinnerungen.</p><p>Im <a href="#/archiv">Archiv</a> liegt es als Zusammenfassung mit Kennzahlen, Review, Entscheidungen und Kundenwissen. Das Review kannst du dort nachträglich ändern. Über <b>Wieder öffnen</b> wird das Projekt wieder aktiv.</p>'}
 ]},
 {g:'awork',items:[
  {v:'1.0',q:'Was macht die awork-Anbindung, und kann das Tool etwas in awork ändern?',a:'<p>Nein, die Anbindung ist <b>nur lesend</b>. Das Tool holt Aufgaben über dein Google-Skript und zeigt sie unter <a href="#/awork">awork-Aufgaben</a>, im Projekt-Tab „awork-Aufgaben“ und auf „Heute“ (bald fällig). Welche Aufgaben zu einem Projekt gehören, steuert das Feld „awork-Projekt“ (Name oder ID). Ist es leer, wird der Projektname genommen.</p>'},
  {v:'1.0',q:'Wie richte ich awork ein?',a:'<ol><li>Unter <a href="#/awork">awork-Aufgaben</a> steht die Anleitung mit dem Code für das Google-Skript.</li><li>Das Skript als Web-App bereitstellen (Ausführen als: Ich, Zugriff: Jeder, der Schutz ist das Geheimwort).</li><li>Web-App-URL und Geheimwort oben bei „awork-Anbindung“ eintragen und auf „Jetzt synchronisieren“ klicken.</li></ol><p>Nach Änderungen am Skript musst du eine neue Version bereitstellen.</p>'}

  {v:'1.0',q:'Was steht in der Backup-Datei, und darf ich sie weitergeben?',a:'<p>Die Datei enthält <b>alle</b> Daten: Kundennamen, Verlauf, Notizen und auch die awork-Einstellungen mit dem Geheimwort. Gib sie deshalb nicht weiter und schicke sie nicht per E-Mail. Passwörter gehören nicht ins Tool.</p>'}

function faqSection(){
  const head=CHANGELOG.slice(0,4),rest=CHANGELOG.slice(4);
  const li=([v,t])=>`<li class="line"><b class="chv">v${esc(v)}</b><span>${esc(t)}</span></li>`;
  return`<section class="sec" id="faq"><h2>FAQ und Kurzanleitung</h2>
  <p class="muted small" style="margin:-4px 0 12px">Für neue Mitarbeiter: die wichtigsten Fragen zum Tool. Die Liste wächst mit jeder neuen Version.</p>
  ${FAQ.map(g=>`<div class="faq-grp"><h3>${esc(g.g)}</h3><div class="panel faq">${g.items.map(i=>`<details><summary>${esc(i.q)}${i.v===VERSION?'<span class="newtag">neu</span>':''}</summary><div class="ans">${i.a}</div></details>`).join('')}</div></div>`).join('')}
  <div class="faq-grp"><h3>Änderungsprotokoll</h3><ul class="list panel">${head.map(li).join('')}</ul>
  ${rest.length?`<details class="past"><summary>Ältere Versionen (${rest.length})</summary><ul class="list panel">${rest.map(li).join('')}</ul></details>`:''}</div></section>`;
}

/* ---- Einstellungen ---- */
views.einstellungen=()=>`<div class="ph"><div><h1>Einstellungen & Backup</h1></div><button class="btn" data-action="scrollFaq">Zur FAQ</button></div>
  <section class="sec"><h2>Darstellung</h2><div class="panel" style="padding:18px">
   <label class="f">Farbschema<select data-change="theme">${[['hell','Hell (Graphit-Weiß)'],['dunkel','Dunkel (Graphit)'],['auto','Automatisch (wie Gerät)']].map(([v,l])=>`<option value="${v}" ${getTheme()===v?'selected':''}>${l}</option>`).join('')}</select></label></div></section>
  <section class="sec"><h2>Backup</h2><div class="panel" style="padding:18px">

/* ============ Darstellung ============ */
const THEME_KEY='eagle-eye.theme';
const getTheme=()=>{try{return localStorage.getItem(THEME_KEY)||'hell'}catch(e){return'hell'}};
function applyTheme(){const t=getTheme();document.documentElement.dataset.theme=(t==='dunkel'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))?'dark':'light'}
function setTheme(t){try{localStorage.setItem(THEME_KEY,t)}catch(e){}applyTheme()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(getTheme()==='auto')applyTheme()});

/* ============ Router ============ */
let route={name:'heute',params:new URLSearchParams()},lastKey='';
function parseRoute(){const h=location.hash.replace(/^#\/?/,'');const [path,qs]=h.split('?');const [name,id]=path.split('/');return{name:name||'heute',id:id||null,params:new URLSearchParams(qs||'')}}
function render(){
  route=parseRoute();const key=route.name+'/'+route.id;
  const v=views[route.name]||views.heute;
  $('#main').innerHTML=v();
  if(key!==lastKey){window.scrollTo(0,0);lastKey=key}
  document.querySelectorAll('textarea.infoname').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+2+'px'});
  document.querySelectorAll('#side nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav.split(',').includes(route.name)));
  updateBadges();
}
function updateBadges(){
  const t=today(),od=activeProjects().reduce((n,p)=>n+p.steps.filter(s=>!s.done&&s.due&&s.due<t).length,0);
  const rc=remindersDue().length;
  $('#bdgHeute').textContent=(od+rc)||'';$('#bdgInbox').textContent=S.notes.filter(n=>n.inbox).length||'';
  document.title=(rc?'('+rc+') ':'')+'Eagle Eye tomedo®';
}
window.addEventListener('hashchange',render);

  addDoc:(f,fd)=>{const p=getP(f.dataset.pid),name=(fd.get('name')||'').trim();if(!name)return;p.docs.push({id:uid(),name,status:'Offen',date:'',note:''});save();render()},
  addEvent:(f,fd)=>{const p=getP(f.dataset.pid);if(!fd.get('date'))return;addEvent(p,fd);render();toast('Termin angelegt')},
  addStep:(f,fd)=>{const p=getP(f.dataset.pid);const title=(fd.get('title')||'').trim();if(!title)return;
    p.steps.push({id:uid(),title,phase:(fd.get('phase')||'').trim(),hint:'',note:'',done:false,doneAt:null,waiting:false,waitingSince:null,due:fd.get('due')||''});save();render()},
  addLog:(f,fd)=>{const p=getP(f.dataset.pid);const text=(fd.get('text')||'').trim();if(!text)return;
    p.log.push({id:uid(),date:fd.get('date')||today(),type:fd.get('type'),who:(fd.get('who')||'').trim(),text});save();render();toast('Eintrag gespeichert')}
};
let noteTimer;
const inputs={
  noteBody:el=>{const n=getN(el.dataset.nid);n.body=el.value;n.updated=new Date().toISOString();$('#preview').innerHTML=rich(n.body)||'<span class="muted">Noch leer</span>';clearTimeout(noteTimer);noteTimer=setTimeout(save,400)},
  aworkQ:el=>{aworkF.q=el.value;const pos=el.selectionStart;render();const i=$('[data-input=aworkQ]');i.focus();i.setSelectionRange(pos,pos)}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=actions[el.dataset.action];if(a){e.preventDefault();a(el,e)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&changes[el.dataset.change])changes[el.dataset.change](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&inputs[el.dataset.input])inputs[el.dataset.input](el)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-submit]');if(f){e.preventDefault();submits[f.dataset.submit](f,new FormData(f))}});

/* Sidebar: Schnellnotiz & Suche */
$('#capture').addEventListener('submit',e=>{e.preventDefault();const i=$('#capInput'),v=i.value.trim();if(!v)return;
  S.notes.push({id:uid(),title:'',body:v,projectId:'',inbox:true,created:new Date().toISOString(),updated:new Date().toISOString()});i.value='';save();toast('In der Inbox');if(['heute','notizen'].includes(route.name))render()});
$('#searchInput').addEventListener('input',e=>{searchQ=e.target.value;if(route.name!=='suche')location.hash='#/suche';else render()});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing&&e.key==='/'){e.preventDefault();$('#searchInput').focus()}
  if(!typing&&(e.key==='n'||e.key==='N')){e.preventDefault();$('#capInput').focus()}
});

$('#ver').textContent='Eagle Eye tomedo® · v'+VERSION;
render();
</script>
<script>
/* v2.1: Startbildschirm (einmal pro Tag) */
(function(){
  var el=document.getElementById('splash'),root=document.documentElement;
  if(!el)return;
  if(!root.classList.contains('splash-on')){el.remove();return}
  var btn=el.querySelector('.sp-logo'),closed=false;
  try{btn.querySelector('img').src=document.querySelector('.brand .logo').src}catch(e){}
  function close(){
    if(closed)return;closed=true;
    window.removeEventListener('keydown',guard,true);
    el.classList.add('leave');
    setTimeout(function(){root.classList.remove('splash-on');el.remove()},480);
  }
  function guard(e){
    if(e.key==='Escape'||e.key==='Enter'||e.key===' ')close();
    if(e.key!=='Tab')e.stopPropagation();
  }
  window.addEventListener('keydown',guard,true);
  btn.addEventListener('click',close);
})();
</script>
</body>
